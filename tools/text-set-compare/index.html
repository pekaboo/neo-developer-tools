<body>
<main class="wrap">
<header class="top"><div class="brand"><span class="mark"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></span><h1>文本对比</h1><span class="tag">本地运行</span></div><div class="controls"><div class="options"><label><input id="ignoreCase" type="checkbox" checked>忽略大小写</label><button class="quiet" id="example">载入示例</button></div><div class="actions"><button class="btn" id="swap">交换前两组内容</button><button class="btn primary" id="compare">对比差异 →</button></div></div></header>
<div class="add-row"><div class="step"><h2 id="inputHeading">编辑分组</h2><span>点击组名可重命名</span></div><button class="btn" id="addGroup"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>添加分组</button></div>
<section class="inputs" aria-label="输入数据">
<div class="panel"><div class="panel-head"><label class="label" for="inputA"><span class="badge">A</span>第一组文本</label><button class="quiet" id="clearA">清空</button></div><textarea id="inputA" spellcheck="false" placeholder="粘贴第一组内容，每行一条&#10;alice@example.com&#10;ORDER-2026-001&#10;或任意文本…"></textarea><div class="input-foot" id="statsA">0 条非空行 · 0 条唯一值</div></div>
<div class="panel"><div class="panel-head"><label class="label" for="inputB"><span class="badge b">B</span>第二组文本</label><button class="quiet" id="clearB">清空</button></div><textarea id="inputB" spellcheck="false" placeholder="粘贴第二组内容，每行一条&#10;bob@example.com&#10;ORDER-2026-002&#10;或任意文本…"></textarea><div class="input-foot" id="statsB">0 条非空行 · 0 条唯一值</div></div>
</section>
<div class="workspace-heading"><h2 id="workspaceHeading">对比结果</h2></div>
<section class="workspace" aria-labelledby="workspaceHeading">
<aside class="panel diagram"><div class="section-kicker">SET EXPLORER</div><h2>点击图形，探索集合</h2><p>选择左侧、交集或右侧区域查看结果。</p>
<svg class="venn" viewBox="0 0 310 205" aria-label="集合筛选图，示意图面积不代表比例">
<path id="region-onlyA" class="region" fill="#e3ecdf" d="M155 39.19 A82 82 0 1 0 155 180.81 A82 82 0 0 1 155 39.19Z" role="button" tabindex="0" aria-label="只在 A 中" data-view="onlyA"/>
<path id="region-onlyB" class="region" fill="#f4e6d7" d="M155 39.19 A82 82 0 1 1 155 180.81 A82 82 0 0 0 155 39.19Z" role="button" tabindex="0" aria-label="只在 B 中" data-view="onlyB"/>

<script>
'use strict';
const get = id => document.getElementById(id);
const titles = {onlyA:['仅 A 中存在','A − B · 在 A 中出现，但不在 B 中'],intersection:['共同数据','A ∩ B · 两组文本中都出现的数据'],onlyB:['仅 B 中存在','B − A · 在 B 中出现，但不在 A 中'],union:['全部数据','A ∪ B · 两组文本合并后的唯一数据'],difference:['所有差异','A △ B · 仅在其中一组出现的数据']};
let currentView = 'difference';
let groups = null;
let toastTimer;
let nextGroupId = 3;
let resultsStale = false;
let comparedIgnoreCase = true;
let editorObservers = [];
let inputs = [{id:1,name:'第一组文本',text:''},{id:2,name:'第二组文本',text:''}];
const storageKey='text-compare.workspace.v1';
function restoreWorkspace(){
  try {
    const saved=JSON.parse(localStorage.getItem(storageKey));
    if(!Array.isArray(saved?.inputs)||saved.inputs.length<2)return;
    const ids=new Set();
    for(const group of saved.inputs){
      if(!Number.isSafeInteger(group?.id)||group.id<1||ids.has(group.id)||typeof group.name!=='string'||typeof group.text!=='string')return;
      ids.add(group.id);
    }
    inputs=saved.inputs;
    nextGroupId=inputs.reduce((next,group)=>Math.max(next,group.id+1),3);
    if(typeof saved.ignoreCase==='boolean')get('ignoreCase').checked=saved.ignoreCase;
  }catch(error){}
}
function saveWorkspace(){
  let message='输入和分组已保存在当前浏览器，不上传。';
  try {
    localStorage.setItem(storageKey,JSON.stringify({inputs,ignoreCase:get('ignoreCase').checked}));
  }catch(error){
    message='本地保存失败：浏览器存储不可用或空间不足，刷新前请先复制文本。';
  }
  if(get('storageStatus').textContent!==message)get('storageStatus').textContent=message;
}
function groupName(group, index) { return `${group.name.trim() || '未命名组'}（第 ${index+1} 组）`; }
function renderInputs() {
  editorObservers.forEach(observer=>observer.disconnect());editorObservers=[];
  const container=document.querySelector('.inputs');container.replaceChildren();
  inputs.forEach((group,index)=>{
    const panel=document.createElement('div');panel.className='panel';
    const head=document.createElement('div');head.className='panel-head';
    const label=document.createElement('label');label.className='label';
    const badge=document.createElement('span');badge.className='badge'+(index%2?' b':'');badge.textContent=index+1;
    const name=document.createElement('input');name.className='group-name';name.value=group.name;name.placeholder='自定义组名';name.setAttribute('aria-label',`第 ${index+1} 组名称`);
    name.addEventListener('input',()=>{group.name=name.value;saveWorkspace();refreshViews();render();});
    name.addEventListener('change',()=>{group.name=name.value.trim()||`第 ${index+1} 组`;name.value=group.name;saveWorkspace();refreshViews();render();});
    label.append(badge,name);
    const clear=document.createElement('button');clear.className='quiet';clear.textContent='清空';
    clear.addEventListener('click',()=>{group.text='';textarea.value='';updateStats();textarea.focus();});
    const groupActions=document.createElement('div');groupActions.className='group-actions';groupActions.append(clear);
    if(inputs.length>2){const remove=document.createElement('button');remove.className='quiet';remove.textContent='删除';remove.setAttribute('aria-label',`删除第 ${index+1} 组`);remove.addEventListener('click',()=>{
      if(group.text.trim()&&!confirm(`删除「${group.name}」及其内容？`))return;
      inputs=inputs.filter(item=>item.id!==group.id);currentView='difference';renderInputs();if(groups)compare();else{refreshViews();render();}
    });groupActions.append(remove);}
    const textarea=document.createElement('textarea');textarea.value=group.text;textarea.spellcheck=false;textarea.id=`input-${group.id}`;textarea.placeholder='粘贴内容，每行一条\nalice@example.com\nORDER-2026-001';textarea.setAttribute('aria-label',`第 ${index+1} 组内容`);
    textarea.addEventListener('input',()=>{group.text=textarea.value;updateStats();});
    const editor=document.createElement('div');editor.className='editor';
    const layer=document.createElement('div');layer.className='highlight-layer';layer.setAttribute('aria-hidden','true');
    const highlights=document.createElement('div');highlights.className='highlight-lines';highlights.id=`highlights-${group.id}`;layer.append(highlights);
    textarea.addEventListener('scroll',()=>{layer.scrollTop=textarea.scrollTop;layer.scrollLeft=textarea.scrollLeft;});
    editor.append(layer,textarea);
    const tools=document.createElement('div');tools.className='group-tools';
    const operation=document.createElement('select');operation.setAttribute('aria-label',`第 ${index+1} 组逐行操作`);
    for(const [value,label] of Object.entries({none:'逐行操作…',lower:'转为小写',upper:'转为大写',trim:'去除首尾空格',nonempty:'删除空行',unique:'去重（保留首次出现）'})){
      const option=document.createElement('option');option.value=value;option.textContent=label;operation.append(option);
    }
    const apply=document.createElement('button');apply.className='btn';apply.textContent='应用';apply.disabled=true;
    operation.addEventListener('change',()=>{apply.disabled=operation.value==='none';});
    apply.addEventListener('click',()=>{
      const updated=transformLines(group.text,operation.value,get('ignoreCase').checked);
      if(updated===group.text){toast('这组内容无需修改');return;}
      const scrollTop=textarea.scrollTop;
      textarea.select();
      if(!document.execCommand?.('insertText',false,updated)||textarea.value!==updated)textarea.value=updated;
      group.text=textarea.value;textarea.setSelectionRange(0,0);textarea.scrollTop=scrollTop;
      updateStats();if(groups)compare();toast('已更新当前组');
    });
    tools.append(operation,apply);
    const stats=document.createElement('div');stats.className='input-foot';stats.id=`stats-${group.id}`;
    head.append(label,tools,groupActions);
    panel.append(head,editor,stats);container.append(panel);
    const observer=new ResizeObserver(()=>syncHighlightSize(group.id));observer.observe(textarea);editorObservers.push(observer);
  });
  updateStats();
}
function parse(text, ignoreCase) {
  const lines = text.split(/\r\n|\n|\r/).map(value => value.trim()).filter(Boolean);
  const entries = new Map();
  for (const value of lines) {
    const key = ignoreCase ? value.toLowerCase() : value;
    if (!entries.has(key)) entries.set(key, value);
  }
  return {lines:lines.length, entries};
}
function calculate(inputGroups, ignoreCase) {
  const records=new Map();
  inputGroups.forEach(group=>{
    for(const [key,value] of parse(group.text,ignoreCase).entries){
      if(!records.has(key))records.set(key,{value,members:[]});
      records.get(key).members.push(group.id);
    }
  });
  const result={onlyA:[],onlyB:[],intersection:[],union:[...records.values()],difference:[]};
  for(const item of result.union){
    const key='members-'+item.members.join('-');
    if(!result[key])result[key]=[];
    result[key].push(item);
    if(item.members.length===inputGroups.length)result.intersection.push(item);
    else result.difference.push(item);
    if(item.members.length===1&&item.members[0]===inputGroups[0].id)result.onlyA.push(item);
    if(item.members.length===1&&item.members[0]===inputGroups[1].id)result.onlyB.push(item);
  }
  return result;
}
function normalize(value, ignoreCase) { const trimmed=value.trim();return ignoreCase?trimmed.toLowerCase():trimmed; }
function transformLines(text, operation, ignoreCase){
  const lines=text.split(/\r\n|\n|\r/);
  switch(operation){
    case 'lower':return lines.map(line=>line.toLowerCase()).join('\n');
    case 'upper':return lines.map(line=>line.toUpperCase()).join('\n');
    case 'trim':return lines.map(line=>line.trim()).join('\n');
    case 'nonempty':return lines.filter(line=>line.trim()).join('\n');
    case 'unique':{
      const seen=new Set();
      return lines.filter(line=>{
        const key=normalize(line,ignoreCase);
        if(!key)return true;
        if(seen.has(key))return false;
        seen.add(key);return true;
      }).join('\n');
    }
    default:return text;
  }
}
function syncHighlightSize(id){
  const textarea=get(`input-${id}`), highlights=get(`highlights-${id}`);
  if(!textarea||!highlights)return;
  highlights.style.width=textarea.clientWidth+'px';
  highlights.parentElement.scrollTop=textarea.scrollTop;
  highlights.parentElement.scrollLeft=textarea.scrollLeft;
}
function renderHighlights(){
  const selected=new Set(!resultsStale?filteredItems().map(item=>normalize(item.value,comparedIgnoreCase)):[]);
  for(const group of inputs){
    const highlights=get(`highlights-${group.id}`);if(!highlights)continue;
    const fragment=document.createDocumentFragment();
    const lines=group.text.split(/\r\n|\n|\r/);
    lines.forEach((line,index)=>{
      const row=document.createElement('div');row.className='highlight-line';
      const number=document.createElement('span');number.className='line-number';number.textContent=index+1;row.append(number);
      if(line.trim()&&selected.has(normalize(line,comparedIgnoreCase))){
        const mark=document.createElement('mark');mark.textContent=line;row.append(mark);
      }else row.append(document.createTextNode(line||'\u200b'));
      fragment.append(row);
    });
    highlights.replaceChildren(fragment);syncHighlightSize(group.id);
  }
}
function selectView(view){
  currentView=view;
  if(!groups||resultsStale)compare();else render();
}
function buildThreeVenn(){
  const svg=get('threeVenn');svg.replaceChildren();
  if(inputs.length!==3)return;
  const create=(tag,attributes={})=>{const element=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [key,value] of Object.entries(attributes))element.setAttribute(key,value);return element;};
  const circles=[{cx:110,cy:87,r:76},{cx:200,cy:87,r:76},{cx:155,cy:163,r:76}];
  const defs=create('defs');svg.append(defs);
  circles.forEach((circle,index)=>{
    const clip=create('clipPath',{id:`three-clip-${index}`});clip.append(create('circle',circle));defs.append(clip);
    const outside=create('clipPath',{id:`three-outside-${index}`});
    outside.append(create('path',{d:`M0 0H310V260H0Z M${circle.cx-circle.r} ${circle.cy} a${circle.r} ${circle.r} 0 1 0 ${circle.r*2} 0 a${circle.r} ${circle.r} 0 1 0 ${-circle.r*2} 0`,'clip-rule':'evenodd','fill-rule':'evenodd'}));defs.append(outside);
  });
  const regions=[{indices:[0],at:[83,71],fill:'#e3ecdf'},{indices:[1],at:[227,71],fill:'#f4e6d7'},{indices:[2],at:[155,211],fill:'#dfeaf5'},{indices:[0,1],at:[155,55],fill:'#d7d9af'},{indices:[0,2],at:[110,148],fill:'#b9d9d0'},{indices:[1,2],at:[200,148],fill:'#dccfda'},{indices:[0,1,2],at:[155,112],fill:'#a9c99e'}];
  for(const region of regions){
    const key='members-'+region.indices.map(index=>inputs[index].id).join('-');
    const names=region.indices.map(index=>groupName(inputs[index],index));
    titles[key]=[names.join(' ∩ '),'仅出现在上述分组中，不在其他组中'];
    const count=groups&&groups[key]?groups[key].length:0;
    let parent=svg;
    circles.forEach((circle,index)=>{const clipGroup=create('g',{'clip-path':`url(#three-${region.indices.includes(index)?'clip':'outside'}-${index})`});parent.append(clipGroup);parent=clipGroup;});
    const area=create('rect',{width:310,height:260,fill:region.fill,class:'region three-region',role:'button',tabindex:0,'data-view':key,'aria-label':`${names.join(' 与 ')}，精确交集 ${count} 条`});
    area.addEventListener('click',()=>selectView(key));area.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();selectView(key);}});parent.append(area);
  }
  for(const region of regions){
    const key='members-'+region.indices.map(index=>inputs[index].id).join('-');
    const number=create('text',{x:region.at[0],y:region.at[1],class:'number'});number.textContent=groups&&groups[key]?groups[key].length:0;
    const label=create('text',{x:region.at[0],y:region.at[1]+17,class:'small'});label.textContent=region.indices.map(index=>index+1).join(' ∩ ');svg.append(number,label);
  }
  const caption=create('text',{x:155,y:255,class:'small'});caption.textContent='数字 1 / 2 / 3 对应上方分组 · 点击任意区域';svg.append(caption);
}
function refreshViews(){
  const first=groupName(inputs[0],0),second=groupName(inputs[1],1);
  titles.onlyA=[`仅 ${inputs[0].name||'第 1 组'}`,`只出现在 ${first}`];
  titles.onlyB=[`仅 ${inputs[1].name||'第 2 组'}`,`只出现在 ${second}`];
  titles.intersection=['全部共有','出现在每一个组中的数据（空组也参与计算）'];
  titles.union=['全部数据','所有组的并集 · 按分组顺序保留首次出现的写法'];
  titles.difference=['所有差异','并集 − 全部共有 · 未同时出现在所有组中的数据'];
  const multi=inputs.length>2;
  document.querySelector('.venn').toggleAttribute('hidden',multi);
  get('threeVenn').toggleAttribute('hidden',inputs.length!==3);
  buildThreeVenn();
  get('combinations').hidden=!multi;
  document.querySelector('.diagram h2').textContent=inputs.length>3?'按归属组合探索':'点击图形，探索集合';
  document.querySelector('.diagram p').textContent=multi?'每个区域或组合只包含恰好出现在这些组中的数据。':'选择左侧、交集或右侧区域查看结果。';
  get('legend').textContent=inputs.length>3?'四组及以上使用精确归属组合展示。所有差异包含部分组共有、但非全部共有的数据。':`当前 ${inputs.length} 组 · 图中数字对应上方分组。自定义名称显示在结果和来源中，图形面积不代表比例。`;
  const box=get('combinations');box.replaceChildren();
  if(multi){
    const keys=new Set(inputs.map(group=>'members-'+group.id));
    if(inputs.length===3)for(const indices of [[0,1],[0,2],[1,2],[0,1,2]])keys.add('members-'+indices.map(index=>inputs[index].id).join('-'));
    if(groups)Object.keys(groups).filter(key=>key.startsWith('members-')).forEach(key=>keys.add(key));
    for(const key of keys){
      const members=key.slice(8).split('-').map(Number);
      const names=members.map(id=>{const index=inputs.findIndex(group=>group.id===id);return index>=0?groupName(inputs[index],index):'';});
      titles[key]=[names.join(' ∩ '),'仅出现在上述分组中，不在其他组中'];
      const button=document.createElement('button');button.className='btn combination';button.dataset.view=key;
      const text=document.createElement('span');text.textContent=names.join(' ∩ ');
      const count=document.createElement('strong');count.textContent=groups&&groups[key]?groups[key].length.toLocaleString():0;
      button.append(text,count);button.addEventListener('click',()=>selectView(key));box.append(button);
    }
  }
}
function updateStats() {
  saveWorkspace();
  for (const group of inputs) {
    const parsed = parse(group.text, get('ignoreCase').checked);
    get('stats-'+group.id).textContent = `${parsed.lines.toLocaleString()} 条非空行 · ${parsed.entries.size.toLocaleString()} 条唯一值 · ${parsed.lines-parsed.entries.size} 条重复`;
  }
  if (groups) {
    resultsStale=true;
    get('status').textContent = '输入已修改，请重新对比';
    get('status').classList.add('status');
    get('compare').textContent = '重新对比 →';
  }
  renderHighlights();
}
function filteredItems() {
  const query = get('search').value.toLowerCase();
  return groups ? (groups[currentView]||[]).filter(item => item.value.toLowerCase().includes(query)) : [];
}
function render() {
  get('resultTitle').textContent = titles[currentView][0];
  get('formula').textContent = titles[currentView][1];
  get('resultCount').textContent = `${groups ? (groups[currentView]||[]).length.toLocaleString() : 0} 条`;
  document.querySelectorAll('[data-view]').forEach(element => {
    const active = element.dataset.view === currentView;
    element.classList.toggle(element.tagName.toLowerCase()==='path' ? 'selected' : 'active',active);
    element.setAttribute('aria-pressed',String(active));
  });
  renderHighlights();
  if (!groups) return;
  const items = filteredItems();
  const list = get('list');
  list.replaceChildren();
  list.scrollTop = 0;
  const displayItems = items.slice(0,2000);
  const fragment = document.createDocumentFragment();
  displayItems.forEach((item,index) => {
    const row = document.createElement('div');row.className='row';
    const text = document.createElement('div');text.className='row-text';
    const number = document.createElement('span');number.className='index';number.textContent=index+1;
    const value = document.createElement('span');value.className='value';value.textContent=item.value;
    const source = document.createElement('span');source.className='source';source.textContent=item.members.map(id=>{const index=inputs.findIndex(group=>group.id===id);return groupName(inputs[index],index);}).join(' + ');
    text.append(number,value);row.append(text,source);fragment.append(row);
  });
  if (!items.length) {
    const empty=document.createElement('div');empty.className='empty';
    const title=document.createElement('strong');title.textContent=get('search').value ? '没有匹配的结果' : '这个集合是空的';
    const detail=document.createElement('span');detail.textContent=get('search').value ? '试试其他关键词，或清空搜索。' : '点击图形中的其他区域，查看不同集合。';
    empty.append(title,detail);fragment.append(empty);
  }
  list.append(fragment);
  get('shown').textContent = `匹配 ${items.length.toLocaleString()} / ${(groups[currentView]||[]).length.toLocaleString()} 条${items.length>2000 ? ' · 仅预览前 2,000 条，复制和下载包含全部匹配项' : ''}`;
}
function compare() {
  groups=calculate(inputs,get('ignoreCase').checked);
  comparedIgnoreCase=get('ignoreCase').checked;resultsStale=false;
  for(const key of ['onlyA','onlyB','intersection','union','difference'])get('num-'+key).textContent=groups[key].length.toLocaleString();
  get('allShared').textContent=groups.intersection.length.toLocaleString();
  refreshViews();
  get('status').textContent='已更新 · 结果保留输入顺序';
  get('status').classList.remove('status');
  get('compare').textContent='对比差异 →';
  render();
}
function toast(message) {
  clearTimeout(toastTimer);get('toast').textContent=message;get('toast').hidden=false;
  toastTimer=setTimeout(()=>get('toast').hidden=true,2800);
}
document.querySelectorAll('[data-view]').forEach(element => {
  const select=()=>selectView(element.dataset.view);
  element.addEventListener('click',select);
  if(element.tagName.toLowerCase()==='path') element.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();select();}});
});
get('addGroup').addEventListener('click',()=>{inputs.push({id:nextGroupId++,name:`第 ${inputs.length+1} 组`,text:''});renderInputs();if(groups)compare();else{refreshViews();render();}get(`input-${inputs[inputs.length-1].id}`).focus();});
get('ignoreCase').addEventListener('change',updateStats);
get('compare').addEventListener('click',compare);
get('search').addEventListener('input',render);
get('swap').addEventListener('click',()=>{const previous=inputs[0].text;inputs[0].text=inputs[1].text;inputs[1].text=previous;renderInputs();if(groups)compare();});
get('example').addEventListener('click',()=>{
  if(inputs.some(group=>group.text.trim())&&!confirm('载入示例会替换所有组的输入，确定继续吗？'))return;
  inputs.forEach((group,index)=>{group.text=`shared@example.com\nteam-${index+1}@example.com\nORDER-2026-001${index===0?'\nshared@example.com':''}${index<2?'\nfirst-two@example.com':''}`;});
  get('search').value='';renderInputs();compare();
});
get('copy').addEventListener('click',async()=>{
  const items=filteredItems();if(!items.length){toast('当前没有可复制的结果');return;}
  const text=items.map(item=>item.value).join('\n');
  try {
    if(!navigator.clipboard)throw new Error('Clipboard unavailable');
    await navigator.clipboard.writeText(text);
    toast(`已复制 ${items.length} 条结果`);
  }catch(error){
    const fallback=document.createElement('textarea');fallback.value=text;fallback.style.position='fixed';fallback.style.opacity='0';document.body.append(fallback);fallback.select();
    let copied=false;try{copied=document.execCommand('copy');}catch(ignored){}fallback.remove();
    toast(copied?`已复制 ${items.length} 条结果`:'浏览器限制了复制，请使用「下载 TXT」');
  }
});
get('download').addEventListener('click',()=>{
  const items=filteredItems();if(!items.length){toast('当前没有可下载的结果');return;}
  const url=URL.createObjectURL(new Blob(['\uFEFF'+items.map(item=>item.value).join('\n')],{type:'text/plain;charset=utf-8'}));
  const anchor=document.createElement('a');anchor.href=url;anchor.download=`${titles[currentView][0]}.txt`;document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast(`已导出 ${items.length} 条结果`);
});
restoreWorkspace();renderInputs();refreshViews();render();
</script>
</body>
</html>
